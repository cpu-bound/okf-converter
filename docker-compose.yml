name: okf-converter

# Toda la configuración (credenciales, puertos, endpoints) vive en el archivo
# `.env` de la raíz, que Docker Compose carga automáticamente. Este archivo
# solo describe el cableado entre servicios.

# `api` y `worker` son dos binarios del mismo módulo de Go, con la misma
# imagen y el mismo entorno: comparten la base de datos, el almacenamiento y
# la cola, pero son procesos distintos en contenedores distintos. Por eso el
# entorno se define una sola vez aquí y ambos lo referencian.
x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV}

  # Puerto interno del contenedor. No se publica al host: el frontend hace de
  # proxy inverso hacia http://api:3000 (ver frontend/nginx.conf), y en el
  # worker solo sirve /metrics para que Prometheus lo raspe.
  PORT: 3000

  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

  JWT_SECRET: ${JWT_SECRET}

  FRONTEND_URL: ${FRONTEND_URL}

  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS}
  WORKER_RETRY_DELAY_SECONDS: ${WORKER_RETRY_DELAY_SECONDS}

  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET}

  # Used only for signing presigned URLs, which the browser follows
  # directly - must be reachable from outside the Docker network.
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
  MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT}
  MINIO_PUBLIC_USE_SSL: "false"

x-backend-dependencies: &backend-dependencies
  db:
    condition: service_healthy

  minio:
    condition: service_started

  rabbitmq:
    condition: service_healthy

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: okf-converter-frontend

    ports:
      - "${FRONTEND_PORT}:80"

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


  # Solo publica trabajos en la cola. Nunca convierte: una conversión larga
  # no puede ocupar una petición HTTP ni un proceso de la API.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: okf-converter-backend

    container_name: okf-converter-api

    environment: *backend-environment

    depends_on: *backend-dependencies

    restart: unless-stopped


  # Solo consume trabajos de la cola. Es el mismo binario compilado en la
  # misma imagen que `api`, con otro entrypoint, y se escala aparte:
  #
  #   docker compose up -d --scale worker=4    (o: make scale SERVICE=worker N=4)
  #
  # No lleva container_name ni puertos publicados justamente para poder
  # correr con varias réplicas.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: okf-converter-backend

    entrypoint: ["/worker"]

    environment: *backend-environment

    depends_on: *backend-dependencies

    deploy:
      replicas: ${WORKER_REPLICAS}

    restart: unless-stopped


  db:
    image: postgres:17-alpine

    container_name: okf-converter-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}

      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  minio:
    image: minio/minio:latest

    container_name: okf-converter-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${FRONTEND_URL}

    ports:
      - "${MINIO_PUBLIC_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:4-management-alpine

    container_name: okf-converter-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping

      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest

    container_name: okf-converter-prometheus

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "${PROMETHEUS_PORT}:9090"

    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:9090/-/healthy

      interval: 5s
      timeout: 5s
      retries: 10

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


  grafana:
    image: grafana/grafana-oss:latest

    container_name: okf-converter-grafana

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}

    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

    ports:
      - "${GRAFANA_PORT}:3000"

    depends_on:
      prometheus:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
