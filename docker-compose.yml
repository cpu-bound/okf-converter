services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: angular-auth-frontend

    ports:
      - "8080:80"

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: angular-auth-api

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: postgresql://auth_user:auth_password@db:5432/auth_db

      JWT_SECRET: change-this-to-a-long-random-secret

      FRONTEND_URL: http://localhost:8080

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: user-files

      # Used only for signing presigned URLs, which the browser follows
      # directly - must be reachable from outside the Docker network.
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: 9000
      MINIO_PUBLIC_USE_SSL: "false"

    depends_on:
      db:
        condition: service_healthy

      minio:
        condition: service_started

    restart: unless-stopped


  db:
    image: postgres:17-alpine

    container_name: angular-auth-db

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U auth_user -d auth_db

      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  minio:
    image: minio/minio:latest

    container_name: angular-auth-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped


volumes:
  postgres_data:
  minio_data: