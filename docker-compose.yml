name: okf-converter

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: okf-converter-frontend

    ports:
      - "8080:80"

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: okf-converter-api

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: postgresql://auth_user:auth_password@db:5432/auth_db

      RABBITMQ_URL: amqp://okf:okf_password@rabbitmq:5672/

      JWT_SECRET: change-this-to-a-long-random-secret

      FRONTEND_URL: http://localhost:8080

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: user-files

      # Used only for signing presigned URLs, which the browser follows
      # directly - must be reachable from outside the Docker network.
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: 9000
      MINIO_PUBLIC_USE_SSL: "false"

    depends_on:
      db:
        condition: service_healthy

      minio:
        condition: service_started

      rabbitmq:
        condition: service_healthy

    restart: unless-stopped


  db:
    image: postgres:17-alpine

    container_name: okf-converter-db

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U auth_user -d auth_db

      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  minio:
    image: minio/minio:latest

    container_name: okf-converter-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8080

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:4-management-alpine

    container_name: okf-converter-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: okf
      RABBITMQ_DEFAULT_PASS: okf_password

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping

      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest

    container_name: okf-converter-prometheus

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:9090/-/healthy

      interval: 5s
      timeout: 5s
      retries: 10

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


  grafana:
    image: grafana/grafana-oss:latest

    container_name: okf-converter-grafana

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

    ports:
      - "3001:3000"

    depends_on:
      prometheus:
        condition: service_healthy

    restart: unless-stopped


volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data: