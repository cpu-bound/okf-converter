global:
  scrape_interval: 15s

scrape_configs:
  # La API solo publica trabajos, así que de aquí sale
  # convert_jobs_enqueued_total.
  - job_name: okf-converter-api
    static_configs:
      - targets: ["api:3000"]

  # Los workers son varias réplicas sin nombre fijo, así que no se pueden
  # listar como targets estáticos. El DNS interno de Docker resuelve el
  # nombre del servicio a la IP de cada réplica, y Prometheus las descubre
  # todas: al escalar el servicio aparecen targets nuevos sin tocar este
  # archivo.
  - job_name: okf-converter-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 3000
        refresh_interval: 15s

  # La profundidad de las colas la reporta el propio RabbitMQ: el plugin
  # rabbitmq_prometheus viene activo de fábrica en la imagen y escucha en
  # 15692. Se raspa el endpoint «detailed» porque el agregado no separa por
  # cola, y aquí importa distinguir la principal de la de reintentos y la de
  # descartes.
  #
  # Esto no es un lujo: el trabajo pendiente es un valor instantáneo, y
  # derivarlo restando contadores de los workers da un número que se va a
  # negativo en cuanto una réplica se reinicia y sus contadores vuelven a
  # cero. RabbitMQ lo publica como gauge, que es lo que realmente es.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics"]
    static_configs:
      - targets: ["rabbitmq:15692"]
