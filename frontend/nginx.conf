server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    location /api/ {
        # El nombre se resuelve en cada petición, no una sola vez al arrancar.
        # nginx solo consulta el DNS en tiempo de ejecución si el destino de
        # proxy_pass es una variable; con el nombre literal cachea la IP para
        # siempre, y basta recrear el contenedor del API (make rebuild S=api)
        # para que se quede apuntando a una IP que Docker ya reasignó -
        # típicamente a un worker, que responde 404 a todo lo que no sea
        # /metrics. El fallo se ve como un error de rutas del API cuando en
        # realidad el tráfico nunca llegó ahí.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;

        proxy_pass $api_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}